# Källor som bevakas varje vecka av tools/bevaka.py (.github/workflows/bevaka.yml).
#
# Syftet är att hitta det som pauseai.se behöver belägg för (se relevans.yaml), systematiskt och
# inte bara när någon råkar se något. Det som hittas här är *tips*. En post skrivs bara om
# primärkällan går att hämta och ett ordagrant citat bekräftar påståendet (se METOD.md).
#
# Fält:
#   namn:    vad som bevakas
#   grupp:   rubrik i veckans ärende
#   url:     RSS-, Atom- eller JSON-flöde, eller en sitemap
#   format:  rss (RSS eller Atom, standard), riksdagen (riksdagens öppna data, JSON) eller
#            sitemap (sajter utan flöde: sidor som ändrats under veckan)
#   sökväg:  för sitemap: bara sidor vars sökväg börjar så här, till exempel [/research/]
#   roll:    primär (standard) när avsändaren själv är källan, eller tips när flödet är ett
#            nyhetsbrev eller en blogg som pekar vidare. Ett tips citeras aldrig: följ länkarna i
#            texten till myndighetens, företagets eller forskarnas egen text.
#   kräv_ai: true om bara poster med AI i titeln ska tas med (flöden som också handlar om annat)
#   kräv_ord: ord som också måste stå i titeln, åtskilda med |
#   kategorier: bara poster i någon av de här kategorierna i flödet (till exempel utan kundcase)
#   varför:  varför källan finns med
#
# Nyhetssökningar (news.google.com) används inte. De gav mest länkar som inte går att följa till
# en primärkälla. I stället gör veckans körning egna sökningar per fråga i relevans.yaml.
# Sajter som aldrig kan vara källa spärras i tools/regler.py (BLOCKERADE), se METOD.md.
#
# bevakning/utfall.csv visar hur många tips och poster varje källa har gett. En källa som inte
# ger poster på länge tas bort.

- namn: Riksdagen, dokument om artificiell intelligens
  grupp: Sverige
  url: https://data.riksdagen.se/dokumentlista/?sok=artificiell+intelligens&sort=datum&sortorder=desc&utformat=json&a=s&sz=200
  format: riksdagen
  kräv_ai: true
  varför: Motioner, interpellationer, frågor, utredningar och propositioner i primärkälla.

- namn: Regeringen, pressmeddelanden
  grupp: Sverige
  url: https://www.regeringen.se/Filter/RssFeed?filterType=Taxonomy&filterByType=FilterablePageBase&preFilteredCategories=1292&rootPageReference=0&filteredContentCategories=1324&filteredPoliticalLevelCategories=&filteredPoliticalAreaCategories=&filteredPublisherCategories=
  kräv_ai: true
  varför: Regeringens beslut, uppdrag och utredningar i primärkälla.

- namn: Integritetsskyddsmyndigheten (IMY)
  grupp: Sverige
  url: https://www.imy.se/nyheter/rss/
  kräv_ai: true
  varför: Svensk tillsyn över AI och dataskydd, i primärkälla.

