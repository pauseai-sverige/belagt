id: BID-12
påstående: Forskare rapporterar att transkript av modellers lösningar fortfarande säger något om modellernas förmåga
  efter att ett test har mättats, och att parvis bedömning minskade prediktionsfelet 5,3 gånger jämfört med att
  bara använda de mättade poängen.
typ: mätning
vem: Morio Hamada, Jehyeok Yeon, Matteo Migliarini, Justin Olive och Magda Dubois (forskare)
datum: '2026-10-14'
tema:
- förmågor
- kontroll
