id: BID-26
påstående: METR bedömer att offentligt tillgängliga belägg inte räcker för att utesluta drastisk acceleration av AI-forskning de närmaste åren.
typ: bedömning
vem: METR (Megan Kinniment m.fl.)
datum: '2026-11-20'
