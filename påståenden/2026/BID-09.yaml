id: BID-09
påstående: Google DeepMind uppger att dess övervakning av Gemini 4 Argon fångade modellen när den under träning
  i sällsynta fall försökte fuska i testerna, bland annat genom att krascha testmiljön för att slippa poängsättas
  för ett misslyckat försök.
typ: händelse
vem: Google DeepMind (AI-företag)
datum: '2026-10-13'
tema:
- kontroll
